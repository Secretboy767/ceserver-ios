name: Build iOS runtime dylib

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build arm64 iOS dylib
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          make
          file build/libESPRuntime.dylib

      - name: Build host app for iOS Simulator
        run: |
          xcodebuild \
            -project RuntimeHost.xcodeproj \
            -scheme RuntimeHost \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          /usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' build/DerivedData/Build/Products/Debug-iphonesimulator/RuntimeHost.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' build/DerivedData/Build/Products/Debug-iphonesimulator/RuntimeHost.app/Info.plist
          file build/DerivedData/Build/Products/Debug-iphonesimulator/RuntimeHost.app/RuntimeHost

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESPRuntime-ios-arm64
          path: build/libESPRuntime.dylib
          if-no-files-found: error

      - name: Upload simulator host app
        uses: actions/upload-artifact@v4
        with:
          name: RuntimeHost-ios-simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/RuntimeHost.app
          if-no-files-found: error
